name: Backend CI

on:
  push:
    branches: [main]
    paths: ['app/**', 'routes/**', 'tests/**', 'composer.json', 'artisan', 'phpunit.xml']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pint, Pest, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: actions/setup-php@v5
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, openssl, bcmath, zip

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Database setup
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS nutrition_ci;"
          php artisan migrate --force

      - name: Pint (code style)
        run: ./vendor/bin/pint --test

      - name: Pest (tests)
        run: ./vendor/bin/pest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            storage/logs/
            .phpunit.result.cache
